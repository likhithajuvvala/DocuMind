name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        working-directory: backend
        run: ./gradlew --no-daemon build
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: backend/*/build/reports/jacoco/test/html
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint infra/k8s/helm/documind --set secrets.jwtSecret=ci --set secrets.databasePassword=ci
      - name: Render and validate against Kubernetes schemas
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          helm template documind infra/k8s/helm/documind \
            --set secrets.jwtSecret=ci --set secrets.databasePassword=ci \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
          helm template documind infra/k8s/helm/documind \
            -f infra/k8s/helm/documind/values-ollama.yaml \
            --set secrets.jwtSecret=ci --set secrets.databasePassword=ci \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
      - name: Refuse to render without a signing key
        run: |
          if helm template documind infra/k8s/helm/documind --set secrets.databasePassword=ci >/dev/null 2>&1; then
            echo "chart rendered without a JWT secret, the credential guard is broken"
            exit 1
          fi

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-service, document-service, ingestion-worker, query-service]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: documind/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: documind/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
