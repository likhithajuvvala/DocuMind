server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway-service
  lifecycle:
    # Gives in-flight requests (and, on this service specifically, any refresh-token rotation
    # mid-transaction) time to finish before the JVM stops accepting SIGTERM as final — matched to
    # server.shutdown: graceful, which stops taking new requests immediately but lets active ones
    # drain within this window.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/documind}
    username: ${DATABASE_USER:documind}
    password: ${DATABASE_PASSWORD:documind}
    hikari:
      pool-name: gateway-hikari
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

documind:
  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-with-a-long-random-value}
    issuer: documind
    access-token-ttl: ${JWT_EXPIRY_MINUTES:15}m
    refresh-token-ttl: 14d
  gateway:
    downstream:
      document-service: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
      query-service: ${QUERY_SERVICE_URL:http://localhost:8083}
    rate-limit:
      enabled: true
      requests-per-window: 120
      window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    root: INFO
    com.documind: DEBUG
