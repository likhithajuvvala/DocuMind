name: documind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: ${DATABASE_USER:-documind}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-documind}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-documind} -d documind"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-documind}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-documind-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # No curl/wget in this image, so fall back to a bare TCP probe via bash's /dev/tcp — good
      # enough to know the REST listener is up and accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-documind}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro,z
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro,z
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards/documind:ro,z
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  gateway-service:
    build:
      context: ../backend
      dockerfile: gateway-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DOCUMENT_SERVICE_URL: http://document-service:8081
      QUERY_SERVICE_URL: http://query-service:8083
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "8080:8080"
    # Docker's default stop_grace_period (10s) is shorter than this service's
    # spring.lifecycle.timeout-per-shutdown-phase (30s) — without raising it, `docker compose
    # stop`/`down` would SIGKILL the JVM mid-graceful-shutdown under any real in-flight-request
    # load, defeating the point of configuring graceful shutdown at all.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  document-service:
    build:
      context: ../backend
      dockerfile: document-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-documind}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-documind-secret}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@documind.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-password-2026}
    ports:
      - "8081:8081"
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      gateway-service:
        condition: service_healthy

  ingestion-worker:
    build:
      context: ../backend
      dockerfile: ingestion-worker/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-documind}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-documind-secret}
      VECTOR_STORE: ${VECTOR_STORE:-pgvector}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6334}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documind}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Matches spring.lifecycle.timeout-per-shutdown-phase: 60s for this service — longer than the
    # others since it's the one that lets an in-flight chunk-and-embed job finish.
    stop_grace_period: 65s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gateway-service:
        condition: service_healthy

  query-service:
    build:
      context: ../backend
      dockerfile: query-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      VECTOR_STORE: ${VECTOR_STORE:-pgvector}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6334}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documind}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-sonnet-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
      RETRIEVAL_SIMILARITY_THRESHOLD: ${RETRIEVAL_SIMILARITY_THRESHOLD:-0.7}
      PII_REDACTION_MODE: ${PII_REDACTION_MODE:-THIRD_PARTY_ONLY}
      RETRIEVAL_RERANKER: ${RETRIEVAL_RERANKER:-lexical}
      RETRIEVAL_RERANK_WEIGHT: ${RETRIEVAL_RERANK_WEIGHT:-0.6}
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Matches spring.lifecycle.timeout-per-shutdown-phase: 45s for this service — longer than
    # gateway/document-service since an in-flight streamed answer needs time to finish.
    stop_grace_period: 50s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gateway-service:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  qdrant-data:
  redis-data:
  grafana-data:
