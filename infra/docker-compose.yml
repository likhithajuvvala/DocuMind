name: documind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: ${DATABASE_USER:-documind}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-documind}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-documind} -d documind"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-documind}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-documind-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-documind}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  gateway-service:
    build:
      context: ../backend
      dockerfile: gateway-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DOCUMENT_SERVICE_URL: http://document-service:8081
      QUERY_SERVICE_URL: http://query-service:8083
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  document-service:
    build:
      context: ../backend
      dockerfile: document-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-documind}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-documind-secret}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@documind.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-password-2026}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
      gateway-service:
        condition: service_started

  ingestion-worker:
    build:
      context: ../backend
      dockerfile: ingestion-worker/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-documind}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-documind-secret}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
      gateway-service:
        condition: service_started

  query-service:
    build:
      context: ../backend
      dockerfile: query-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documind
      DATABASE_USER: ${DATABASE_USER:-documind}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-documind}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment-with-a-long-random-value}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - gateway-service

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  qdrant-data:
  grafana-data:
