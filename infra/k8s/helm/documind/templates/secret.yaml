{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "documind.secretName" . }}
  labels:
    {{- include "documind.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.secrets.databaseUser | quote }}
  DATABASE_PASSWORD: {{ required "secrets.databasePassword is required unless secrets.existingSecret is set" .Values.secrets.databasePassword | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required unless secrets.existingSecret is set, and the application refuses to be secure without it" .Values.secrets.jwtSecret | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
{{- end }}
