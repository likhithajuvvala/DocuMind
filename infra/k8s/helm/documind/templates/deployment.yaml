{{- $root := . -}}
{{- range $name, $service := .Values.services }}
{{- $isJava := ne $service.java false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "documind.fullname" $root }}-{{ $name }}
  labels:
    {{- include "documind.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $service.autoscaling.enabled }}
  replicas: {{ $service.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "documind.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ include "documind.serviceAccountName" $root }}
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.registry }}/{{ $name }}:{{ include "documind.imageTag" $root }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          {{- if $isJava }}
          envFrom:
            - configMapRef:
                name: {{ include "documind.configMapName" $root }}
            - secretRef:
                name: {{ include "documind.secretName" $root }}
          {{- else }}
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: {{ $root.Values.frontend.apiBaseUrl | quote }}
          {{- end }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          {{- if $isJava }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          {{- else }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # containerSecurityContext.readOnlyRootFilesystem is true for every container (see
      # values.yaml), so each one needs somewhere writable — the JVM's default java.io.tmpdir and
      # Tomcat's work directory are both under /tmp, and Next's standalone server touches it too.
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
