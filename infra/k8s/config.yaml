apiVersion: v1
kind: ConfigMap
metadata:
  name: documind-config
  namespace: documind
data:
  DATABASE_URL: jdbc:postgresql://postgres:5432/documind
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: documind-documents
  DOCUMENT_SERVICE_URL: http://document-service:8081
  QUERY_SERVICE_URL: http://query-service:8083
  LLM_PROVIDER: openai
  EMBEDDING_PROVIDER: openai
---
apiVersion: v1
kind: Secret
metadata:
  name: documind-secrets
  namespace: documind
type: Opaque
stringData:
  DATABASE_USER: documind
  DATABASE_PASSWORD: replace-me
  JWT_SECRET: replace-me-with-a-long-random-value
  S3_ACCESS_KEY: replace-me
  S3_SECRET_KEY: replace-me
  OPENAI_API_KEY: replace-me
  ANTHROPIC_API_KEY: replace-me
