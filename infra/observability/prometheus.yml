global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: document-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["document-service:8081"]

  - job_name: ingestion-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-worker:8082"]

  - job_name: query-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["query-service:8083"]
